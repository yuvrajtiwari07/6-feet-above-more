name: AI Jobs Tick

# Manual only — no schedule trigger. Fire this from the Actions tab
# ("Run workflow") or from the command line with `gh workflow run
# ai-jobs-tick.yml` whenever you actually want a job to advance. The
# admin panel's "Run Now" button hits the same endpoint directly from
# your browser session and doesn't need this workflow at all — this is
# just an alternate manual trigger.
on:
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Advance next AI discovery/retag job
        run: |
          curl -sf -X POST "$APP_URL/api/admin/ai-jobs/tick" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 25
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
